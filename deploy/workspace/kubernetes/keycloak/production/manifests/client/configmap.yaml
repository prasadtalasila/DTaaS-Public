apiVersion: v1
kind: ConfigMap
metadata:
  name: client-config
  namespace: dtaas-workspace
data:
  env.js: |
    if (typeof window !== 'undefined') {
      window.env = {
        REACT_APP_ENVIRONMENT: 'prod',
        REACT_APP_URL: 'https://YOUR_SERVER_DNS/',
        REACT_APP_URL_BASENAME: '',
        REACT_APP_URL_DTLINK: '/lab',
        REACT_APP_URL_LIBLINK: '',
        REACT_APP_CLIENT_ID: 'dtaas-client',
        REACT_APP_AUTH_AUTHORITY: 'https://YOUR_SERVER_DNS/auth/realms/dtaas',
        REACT_APP_REDIRECT_URI: 'https://YOUR_SERVER_DNS/Library',
        REACT_APP_LOGOUT_REDIRECT_URI: 'https://YOUR_SERVER_DNS/',
        REACT_APP_GITLAB_SCOPES: 'openid profile',
      };
    }
