apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: user1
  namespace: dtaas-workspace
spec:
  entryPoints:
    - web-secure
  routes:
    - match: Host(`YOUR_SERVER_DNS`) && PathPrefix(`/user1`)
      kind: Rule
      middlewares:
        - name: traefik-forward-auth
      services:
        - name: user1
          port: 8888
  tls:
    certResolver: letsencrypt
