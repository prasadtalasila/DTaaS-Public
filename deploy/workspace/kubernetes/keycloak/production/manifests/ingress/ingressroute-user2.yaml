apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: user2
  namespace: dtaas-workspace
spec:
  entryPoints:
    - web-secure
  routes:
    - match: Host(`intocps.org`) && PathPrefix(`/user2`)
      kind: Rule
      middlewares:
        - name: traefik-forward-auth
      services:
        - name: user2
          port: 8888
  tls: {}
