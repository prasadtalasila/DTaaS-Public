# Environment variables from deploy/services/runner/.env.example

services:
  gitlab-runner:
    container_name: gitlab-runner
    # Runner image version is independent of the gitlab-ce image version
    image: gitlab/gitlab-runner:alpine-v17.5.3
    volumes:
      - "./runner-config.toml:/etc/gitlab-runner/config.toml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Optional: self-signed certificate mapping for localhost.
      # Copy fullchain.pem into deploy/services/runner/ and uncomment below:
      # - "./fullchain.pem:/etc/gitlab-runner/certs/localhost.crt:ro"

    # To make https://localhost accessible from the container
    network_mode: host
