---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dtaas

resources:
  - 00-namespace.yaml
  - 01-configmaps.yaml
  - 02-secrets.yaml
  - 03-volumes.yaml
  - 04-traefik.yaml
  - 05-client.yaml
  - 06-libms.yaml
  - 07-user-workspaces.yaml
  - 08-traefik-forward-auth.yaml
  - 09-ingress.yaml

# Optional: Add common labels to all resources
commonLabels:
  app.kubernetes.io/name: dtaas
  app.kubernetes.io/managed-by: kustomize

# Optional: Add common annotations
commonAnnotations:
  description: "DTaaS - Digital Twin as a Service Platform"
