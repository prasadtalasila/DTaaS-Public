---
# Secret for OAuth configuration
# NOTE: All values must be base64 encoded
# To encode: echo -n 'your-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: oauth-credentials
  namespace: dtaas
type: Opaque
data:
  # Base64 encoded values - REPLACE THESE WITH YOUR ACTUAL VALUES
  # Example commands to generate:
  # echo -n 'https://gitlab.foo.com/oauth/authorize' | base64
  # echo -n 'https://gitlab.foo.com/oauth/token' | base64
  # echo -n 'https://gitlab.foo.com/api/v4/user' | base64
  # echo -n 'your-client-id' | base64
  # echo -n 'your-client-secret' | base64
  # echo -n 'random-secret-string' | base64
  oauth-auth-url: aHR0cHM6Ly9naXRsYWIuZm9vLmNvbS9vYXV0aC9hdXRob3JpemU=  # https://gitlab.foo.com/oauth/authorize
  oauth-token-url: aHR0cHM6Ly9naXRsYWIuZm9vLmNvbS9vYXV0aC90b2tlbg==  # https://gitlab.foo.com/oauth/token
  oauth-user-url: aHR0cHM6Ly9naXRsYWIuZm9vLmNvbS9hcGkvdjQvdXNlcg==  # https://gitlab.foo.com/api/v4/user
  oauth-client-id: eHg=  # xx (placeholder - replace with actual value)
  oauth-client-secret: eHg=  # xx (placeholder - replace with actual value)
  oauth-secret: cmFuZG9tLXNlY3JldC1zdHJpbmc=  # random-secret-string

---
# Secret for TLS certificates
# NOTE: This is a placeholder. You need to create this secret with your actual certificates
# kubectl create secret tls traefik-tls-cert \
#   --cert=/path/to/fullchain.pem \
#   --key=/path/to/privkey.pem \
#   --namespace=dtaas
apiVersion: v1
kind: Secret
metadata:
  name: traefik-tls-cert
  namespace: dtaas
type: kubernetes.io/tls
data:
  # These should be replaced with actual certificate data
  # Base64 encoded fullchain.pem
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0t
  # Base64 encoded privkey.pem
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCi4uLgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0t
