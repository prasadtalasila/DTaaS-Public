---
# PersistentVolume for DTaaS files
# Note: Adjust storage path and capacity based on your cluster setup
# For k3s, local-path provisioner is available by default
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dtaas-files-pv
  namespace: dtaas
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /dtaas/files
    type: DirectoryOrCreate

---
# PersistentVolumeClaim for DTaaS files
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dtaas-files-pvc
  namespace: dtaas
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path

