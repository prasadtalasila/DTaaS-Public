name: K8s Keycloak CLI

'on':
  push:
    paths:
      - 'deploy/workspace/kubernetes/keycloak/production/cli/**'
      - '.github/workflows/k8s-scripts.yml'
  pull_request:
    paths:
      - 'deploy/workspace/kubernetes/keycloak/production/cli/**'
      - '.github/workflows/k8s-scripts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and Lint K8s CLI
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/workspace/kubernetes/keycloak/production/cli

    steps:
      - name: Checkout Repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false

      - name: Setup Python
        # v6.1.0
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pylint (min score 9.0)
        run: |
          pylint . tests/ \
            --rcfile=${GITHUB_WORKSPACE}/.pylintrc \
            --fail-under=9.0

      - name: Run pytest (with coverage)
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # v5.5.2
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: deploy/workspace/kubernetes/keycloak/production/cli/coverage.xml
          flags: k8s-cli
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run pyright (type checking)
        run: |
          pyright .
