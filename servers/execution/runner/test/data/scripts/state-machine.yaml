# The state machine of the test scripts, for trying out the state
# machine and parameters requests of api/dev.api.http and
# api/dev.mqtt.http
events:
  - restart
  - scope-changed
parameters:
  scope:
    type: enum
    values: [single, multi]
    default: single
    controllable: true
    # raised when the value changes
    event: scope-changed
  capacity:
    type: number
    default: 20
    controllable: false
states:
  create:
    transitions:
      $success: execute
  execute:
    transitions:
      restart: create
      scope-changed:
        state: execute
        stop: true
