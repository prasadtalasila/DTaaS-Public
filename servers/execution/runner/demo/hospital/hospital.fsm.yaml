# The class of the hospital twins: both hospital-1 and hospital-2 run
# this file, each with the values and the peers of its own runner.yaml.
# A hospital is open for admissions, full, or closed; each state runs
# the script of the same name in scripts/.
class:
  id: 'urn:dtaas:demo:hospital'
  version: '1.0.0'
events:
  - full
  - beds-free
  - scope-changed
  - fidelity-changed
  - close
  - reopen
  - neighbour-full
  - neighbour-down
parameters:
  # the shared-policy parameter: a patient goes to the requested ward
  # only (single), or to any ward with a free bed (multi)
  scope:
    type: string
    enum:
      - single
      - multi
    default: single
    controllable: true
    event: scope-changed
  # beds per ward, which the Manager may read but not change; an
  # instance sets its own under parameters in runner.yaml
  capacity:
    type: integer
    minimum: 1
    default: 2
    controllable: false
  # how often open samples the beds, from the cheapest to the most
  # accurate (STATE-MACHINE.md, Pattern: Fidelity)
  fidelity:
    type: string
    enum:
      - low
      - medium
      - high
    default: medium
    controllable: true
    event: fidelity-changed
# the latest values that the scripts hand the runner, for the Manager
# and the peers; the runner never reads them
properties:
  # the free beds of all wards, which open writes at each sample
  free-beds:
    type: integer
    minimum: 0
    unit: beds
env:
  HINT: '${DT_ID}/${DT_STATE}#${DT_ENTRY} scope=${DT_PARAM_SCOPE}'
escalation:
  onFailure: true
  onNoTransition: true
manager:
  commands:
    - admit
    - discharge
    - forecast-beds
# the commands that copy the beds into a snapshot and back from one
snapshot:
  save: save-script
  restore: restore-script
# the commands that POST /whatif runs on a private copy of the twin;
# replay: the scripts keep to their own beds in a replay twin, so
# runner-replay may start one
whatIf:
  commands:
    - forecast-beds
  replay: true
# events that the runner raises when a neighbour changes: a peer that
# runner.yaml gives the relationship neighbour
subscriptions:
  - relationship: neighbour
    when:
      state: full
    event: neighbour-full
  - relationship: neighbour
    when:
      online: false
    event: neighbour-down
states:
  open:
    env:
      POLL_MS: 500
    transitions:
      full: full
      scope-changed:
        state: open
        stop: true
      fidelity-changed:
        state: open
        stop: true
      neighbour-full:
        state: open
        stop: true
      neighbour-down:
        state: open
        stop: true
      close:
        state: closed
        stop: true
      $stopped: closed
  full:
    transitions:
      beds-free: open
  closed:
    transitions:
      reopen: open
